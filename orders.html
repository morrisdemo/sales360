<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Order History Table</title>
  <script
    id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
  ></script>
</head>
<body class="sapUiBody" id="content">
  <script>
    sap.ui.getCore().attachInit(function () {
      const serviceOrders = [
        {
          orderNumber: "904161",
          orderType: "USRV",
          activityType: "CRTD MANC NMAT PRC",
          description: "Outage Reported",
          startDate: "11/12/2025",
          startTime: "08:00",
          endDate: "11/12/2025",
          endTime: "12:00",
          sysStatus: "PEND",
          userStatus: "C",
          notes: "Customer reported outage during high winds."
        },
        {
          orderNumber: "904160",
          orderType: "USRV",
          activityType: "CRTD MANC NMAT PRC",
          description: "Meter Glass Broken",
          startDate: "09/12/2025",
          startTime: "10:30",
          endDate: "09/12/2025",
          endTime: "13:00",
          sysStatus: "PEND",
          userStatus: "2",
          notes: "Technician found damage during inspection."
        },
        {
          orderNumber: "904159",
          orderType: "USRV",
          activityType: "REL NMAT PRC",
          description: "Meter Inspection Order",
          startDate: "03/24/2025",
          startTime: "09:00",
          endDate: "03/24/2025",
          endTime: "11:45",
          sysStatus: "REL",
          userStatus: "3",
          notes: "Routine meter inspection completed."
        }
      ];

      const oModel = new sap.ui.model.json.JSONModel({ orders: serviceOrders });

      const oTable = new sap.m.Table("serviceOrderTable", {
        headerText: "Service Order History",
        growing: true,
        growingThreshold: 10,
        mode: "None",
        columns: [
          new sap.m.Column({ header: new sap.m.Label({ text: "Order #" }), sortProperty: "orderNumber", filterProperty: "orderNumber" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Order Type" }), sortProperty: "orderType" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Activity Type" }), sortProperty: "activityType" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Order Description" }), sortProperty: "description" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Start Date" }), sortProperty: "startDate" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Start Time" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "End Date" }), sortProperty: "endDate" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "End Time" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "System Status" }), sortProperty: "sysStatus" }),
          new sap.m.Column({ header: new sap.m.Label({ text: "User Status" }) }),
          new sap.m.Column({ header: new sap.m.Label({ text: "Notes" }) })
        ],
        items: {
          path: "/orders",
          template: new sap.m.ColumnListItem({
            type: "Inactive",
            cells: [
              new sap.m.Text({ text: "{orderNumber}" }),
              new sap.m.Text({ text: "{orderType}" }),
              new sap.m.Text({ text: "{activityType}" }),
              new sap.m.Text({ text: "{description}" }),
              new sap.m.Text({ text: "{startDate}" }),
              new sap.m.Text({ text: "{startTime}" }),
              new sap.m.Text({ text: "{endDate}" }),
              new sap.m.Text({ text: "{endTime}" }),
              new sap.m.ObjectStatus({
                text: "{sysStatus}",
                state: {
                  path: "sysStatus",
                  formatter: function (status) {
                    return status === "REL" ? "Success" : "Warning";
                  }
                }
              }),
              new sap.m.Text({ text: "{userStatus}" }),
              new sap.m.Text({ text: "{notes}" })
            ]
          })
        }
      });

      const oSearchField = new sap.m.SearchField({
        width: "100%",
        placeholder: "Search Order Description...",
        liveChange: function (oEvent) {
          const sQuery = oEvent.getParameter("newValue");
          const oBinding = oTable.getBinding("items");
          const aFilters = [];

          if (sQuery && sQuery.length > 0) {
            aFilters.push(new sap.ui.model.Filter("description", sap.ui.model.FilterOperator.Contains, sQuery));
          }

          oBinding.filter(aFilters);
        }
      });

      const oPage = new sap.m.Page({
        title: "Service Order History Table",
        content: [oSearchField, oTable]
      });

      const oApp = new sap.m.App({ initialPage: "mainPage" });
      oApp.addPage(oPage);
      oApp.placeAt("content");
      oApp.setModel(oModel);
    });
  </script>
</body>
</html>
