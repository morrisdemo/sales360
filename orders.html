<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Service Order History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script
    id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m"
    data-sap-ui-async="true"
    data-sap-ui-compatVersion="edge"
  ></script>
</head>
<body class="sapUiBody" id="content">
  <script>
    sap.ui.getCore().attachInit(function () {
      const serviceOrders = [
        {
          orderNumber: "904161",
          orderType: "USRV",
          activityType: "MANC",
          startDate: "2025-11-12",
          startTime: "08:00",
          endDate: "2025-11-12",
          endTime: "12:00",
          sysStatus: "PEND",
          userStatus: "CRTD NMAT PRC",
          notes: "Outage Reported"
        },
        {
          orderNumber: "904160",
          orderType: "USRV",
          activityType: "MANC",
          startDate: "2025-09-12",
          startTime: "10:30",
          endDate: "2025-09-12",
          endTime: "13:00",
          sysStatus: "PEND",
          userStatus: "CRTD NMAT PRC",
          notes: "Meter Glass Broken"
        },
        {
          orderNumber: "904159",
          orderType: "USRV",
          activityType: "NMAT",
          startDate: "2025-03-24",
          startTime: "09:00",
          endDate: "2025-03-24",
          endTime: "11:45",
          sysStatus: "REL",
          userStatus: "REL NMAT PRC",
          notes: "Meter Inspection Order"
        }
      ];

      const oModel = new sap.ui.model.json.JSONModel({ orders: serviceOrders });

      const table = new sap.m.Table({
        headerText: "Service Order History",
        growing: true,
        growingScrollToLoad: true,
        mode: "None",
        columns: [
          new sap.m.Column({
            header: new sap.m.Label({ text: "Order #" }),
            sortProperty: "orderNumber",
            filterProperty: "orderNumber"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "Order Type" }),
            sortProperty: "orderType"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "Activity Type" }),
            sortProperty: "activityType"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "Start Date" }),
            sortProperty: "startDate"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "Start Time" })
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "End Date" }),
            sortProperty: "endDate"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "End Time" })
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "System Status" }),
            sortProperty: "sysStatus"
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "User Status" })
          }),
          new sap.m.Column({
            header: new sap.m.Label({ text: "Notes" })
          })
        ],
        items: {
          path: "/orders",
          template: new sap.m.ColumnListItem({
            cells: [
              new sap.m.Text({ text: "{orderNumber}" }),
              new sap.m.Text({ text: "{orderType}" }),
              new sap.m.Text({ text: "{activityType}" }),
              new sap.m.Text({ text: "{startDate}" }),
              new sap.m.Text({ text: "{startTime}" }),
              new sap.m.Text({ text: "{endDate}" }),
              new sap.m.Text({ text: "{endTime}" }),
              new sap.m.ObjectStatus({
                text: "{sysStatus}",
                state: {
                  path: "sysStatus",
                  formatter: function (status) {
                    return status === "REL" ? "Success" : "Warning";
                  }
                }
              }),
              new sap.m.Text({ text: "{userStatus}" }),
              new sap.m.Text({ text: "{notes}" })
            ]
          })
        }
      });

      table.setModel(oModel);

      const searchField = new sap.m.SearchField({
        width: "100%",
        placeholder: "Search Orders...",
        liveChange: function (oEvent) {
          const query = oEvent.getParameter("newValue").toLowerCase();
          const filters = [];

          if (query) {
            filters.push(
              new sap.ui.model.Filter({
                filters: [
                  new sap.ui.model.Filter("orderNumber", sap.ui.model.FilterOperator.Contains, query),
                  new sap.ui.model.Filter("notes", sap.ui.model.FilterOperator.Contains, query),
                  new sap.ui.model.Filter("sysStatus", sap.ui.model.FilterOperator.Contains, query)
                ],
                and: false
              })
            );
          }

          table.getBinding("items").filter(filters);
        }
      });

      const page = new sap.m.Page({
        title: "Service Order History",
        content: [
          searchField,
          table
        ]
      });

      const app = new sap.m.App();
      app.addPage(page);
      app.placeAt("content");
    });
  </script>
</body>
</html>
