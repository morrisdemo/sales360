<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Intelligence Overview</title>

  <script
    id="sap-ui-bootstrap"
    src="https://sdk.openui5.org/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-libs="sap.m"
    data-sap-ui-async="true"
    data-sap-ui-compatVersion="edge"
  ></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
/* Make each grid row the same height (as tall as the tallest card in that row) */
.cardGrid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1rem;
  padding: 1rem;

  /* Key: make implicit rows equal-height */
  grid-auto-rows: 1fr;
  align-items: stretch;
}

/* Make the UI5 Panel fill the grid cell */
    .cardGrid > .sapMPanel {
      height: 90%;
    }
    
    /* Ensure panel content stretches vertically so toolbars stay pinned */
    .cardGrid > .sapMPanel .sapMPanelContent {
      height: calc(100% - 3rem); /* approx header height */
      display: flex;
      flex-direction: column;
    }
    
    /* Make the VBox inside each card take available vertical space */
    .cardGrid > .sapMPanel .sapMVBox {
      flex: 1 1 auto;
    }
    
    /* Keep the last toolbar/button row at the bottom if present */
    .cardGrid > .sapMPanel .sapMToolbar,
    .cardGrid > .sapMPanel .sapMTB {
      margin-top: auto;
    }

    .cardGrid > .sapMPanel {
    min-height: 200px; /* pick what looks best */
    background: #fff;
    }

    .sapMPanel { height: 100%; }
    #demandChart {
      width: 100%;
      height: 400px !important;
      max-height: 400px;
      margin: 1rem 0;
    }

    /* Small “chip” tags that still feel Fiori-ish */
    .chipRow {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: #1d2d3e;
      line-height: 1.2;
      user-select: none;
    }
    .chip--risk { border-color: #f3d1a5; background: #fff7ed; }
    .chip--bad  { border-color: #f5b5b5; background: #fff1f2; }
    .chip--good { border-color: #b7e1cd; background: #f0fdf4; }
    .muted { color: #5f6b7a; }

    /* Aging bucket tiles */
    .agingGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .agingTile {
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 0.6rem 0.65rem;
      background: #fff;
    }
    .agingHdr {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.25rem;
    }
    .agingLabel { font-size: 0.8rem; color: #5f6b7a; }
    .agingValue { font-size: 1.05rem; font-weight: 600; color: #1d2d3e; }
    .agingBar {
      height: 0.45rem;
      border-radius: 999px;
      background: #eef2f7;
      overflow: hidden;
    }
    .agingFill { height: 100%; border-radius: 999px; }
    .agingFill--warn { background: #f59e0b; }
    .agingFill--bad  { background: #ef4444; }
    .agingFill--ok   { background: #22c55e; }
  </style>
</head>

<body class="sapUiBody" id="content">
  <div id="cardContainer" class="cardGrid"></div>
  <canvas id="demandChart"></canvas>

  <script>
    sap.ui.getCore().attachInit(function () {

      const createCard = (title, content) => new sap.m.Panel({
        headerText: title,
        expandable: false,
        content: [content],
        class: "sapUiResponsiveMargin"
      });

      /**
       * SAMPLE DATA MODEL
       */
      const model = {
        account: {
          name: "Acme Manufacturing",
          lastUpdated: "01/08/2026 10:12 AM",
          renewalDate: "03/15/2026",
          daysToRenewal: 67,
          annualRevenue: 182500,
          revenueAtRisk: 21400,
          revenueAtRiskTrend: "+$2.8k vs last 30 days",
          riskLabel: "Medium Risk",
          riskState: "Warning",
          riskDrivers: [
            { key: "AR", label: "AR: 31–60 growing", severity: "bad" },
            { key: "DISPUTE", label: "Disputes: $3.1k open", severity: "risk" },
            { key: "SLA", label: "SLA breaches: 2", severity: "risk" },
            { key: "USAGE", label: "Usage anomaly: spike", severity: "risk" },
            { key: "RENEWAL", label: "Renewal in 67 days", severity: "risk" }
          ]
        },
        ar: {
          totalPastDue: 23854.12,
          dso: 41,
          aging: { "0_30": 11243.17, "31_60": 9810.94, "60_plus": 2800.01 },
          disputes: { count: 2, amount: 3100.00, topReason: "Estimated bill challenge" }
        },
        service: {
          openCases: { high: 1, med: 3, low: 4 },
          slaBreaches30: 2,
          reopenRate90: "12%",
          topIssues: ["Billing adjustment", "Power quality", "Meter read exception"],
          lastTouchpoint: "Support Call (Email)"
        },
        outage: {
          text: "Planned maintenance - 02/10/2026 8am–2pm",
          state: "Warning"
        }
      };

      // Helpers
      const fmtUSD = (v) => `$${Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      const buildChipsHtml = (chips) => {
        const cls = (sev) => sev === "bad" ? "chip chip--bad" : sev === "good" ? "chip chip--good" : "chip chip--risk";
        return `
          <div class="chipRow">
            ${chips.map(c => `<span class="${cls(c.severity)}">${c.label}</span>`).join("")}
          </div>
        `;
      };

      // Aging HTML (tiles + proportions)
      const agingTotal =
        (model.ar.aging["0_30"] + model.ar.aging["31_60"] + model.ar.aging["60_plus"]) || 1;
      const pct = (v) => Math.round((v / agingTotal) * 100);

      const agingHtml = `
        <div class="agingGrid">
          <div class="agingTile">
            <div class="agingHdr">
              <span class="agingLabel">0–30</span>
              <span class="agingValue">${fmtUSD(model.ar.aging["0_30"])}</span>
            </div>
            <div class="agingBar">
              <div class="agingFill agingFill--warn" style="width:${pct(model.ar.aging["0_30"])}%"></div>
            </div>
            <div class="muted" style="margin-top:0.25rem;font-size:0.75rem;">
              ${pct(model.ar.aging["0_30"])}% of past due
            </div>
          </div>

          <div class="agingTile">
            <div class="agingHdr">
              <span class="agingLabel">31–60</span>
              <span class="agingValue">${fmtUSD(model.ar.aging["31_60"])}</span>
            </div>
            <div class="agingBar">
              <div class="agingFill agingFill--bad" style="width:${pct(model.ar.aging["31_60"])}%"></div>
            </div>
            <div class="muted" style="margin-top:0.25rem;font-size:0.75rem;">
              ${pct(model.ar.aging["31_60"])}% of past due
            </div>
          </div>

          <div class="agingTile">
            <div class="agingHdr">
              <span class="agingLabel">60+</span>
              <span class="agingValue">${fmtUSD(model.ar.aging["60_plus"])}</span>
            </div>
            <div class="agingBar">
              <div class="agingFill agingFill--bad" style="width:${pct(model.ar.aging["60_plus"])}%"></div>
            </div>
            <div class="muted" style="margin-top:0.25rem;font-size:0.75rem;">
              ${pct(model.ar.aging["60_plus"])}% of past due
            </div>
          </div>
        </div>
      `;

      // =====================
      // Popovers (Risk / AR / Contract)
      // =====================

      const riskPopover = new sap.m.Popover({
        title: "Risk Details",
        placement: "Auto",
        contentWidth: "420px",
        content: [
          new sap.m.VBox({
            width: "100%",
            items: [
              new sap.m.ObjectStatus({
                text: model.account.riskLabel,
                state: model.account.riskState,
                icon: "sap-icon://shield"
              }),
              new sap.m.Text({ text: "Top drivers", class: "muted" }),
              new sap.m.List({
                items: model.account.riskDrivers.map(d =>
                  new sap.m.StandardListItem({
                    title: d.label,
                    icon: d.severity === "bad" ? "sap-icon://error" : "sap-icon://alert",
                    info: d.key,
                    infoState: d.severity === "bad" ? "Error" : "Warning"
                  })
                )
              }),
              new sap.m.MessageStrip({
                text: "Recommended: create a proactive action plan (AR follow-up + dispute resolution + SLA recovery).",
                type: "Information",
                showIcon: true
              }),
              new sap.m.Text({ text: `Last updated: ${model.account.lastUpdated}`, class: "muted" })
            ]
          })
        ],
        footer: new sap.m.Toolbar({
          content: [
            new sap.m.Button({ text: "Create Action", type: "Emphasized", icon: "sap-icon://add-task" }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ text: "Close", press: () => riskPopover.close() })
          ]
        })
      });

      const arPopover = new sap.m.Popover({
        title: "Billing & AR Breakdown",
        placement: "Auto",
        contentWidth: "420px",
        content: [
          new sap.m.VBox({
            width: "100%",
            items: [
              new sap.m.ObjectNumber({
                number: Number(model.ar.totalPastDue || 0).toFixed(2),
                unit: "USD Past Due",
                state: (model.ar.totalPastDue > 0) ? "Error" : "Success"
              }),
              new sap.m.Text({ text: `DSO: ${model.ar.dso} days`, class: "muted" }),

              new sap.m.Title({ text: "Aging", level: "H6" }),
              new sap.m.List({
                items: [
                  new sap.m.DisplayListItem({ label: "0–30", value: fmtUSD(model.ar.aging["0_30"]) }),
                  new sap.m.DisplayListItem({ label: "31–60", value: fmtUSD(model.ar.aging["31_60"]) }),
                  new sap.m.DisplayListItem({ label: "60+", value: fmtUSD(model.ar.aging["60_plus"]) })
                ]
              }),

              new sap.m.Title({ text: "Disputes", level: "H6" }),
              new sap.m.ObjectStatus({
                text: `${model.ar.disputes.count} open — ${fmtUSD(model.ar.disputes.amount)} (${model.ar.disputes.topReason})`,
                state: model.ar.disputes.count > 0 ? "Warning" : "Success",
                icon: "sap-icon://incident"
              }),

              new sap.m.MessageStrip({
                text: "Recommended: offer a payment plan + schedule a billing review call.",
                type: "Information",
                showIcon: true
              })
            ]
          })
        ],
        footer: new sap.m.Toolbar({
          content: [
            new sap.m.Button({ text: "Payment Plan", type: "Emphasized", icon: "sap-icon://wallet" }),
            new sap.m.Button({ text: "Create Task", icon: "sap-icon://add-task" }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ text: "Close", press: () => arPopover.close() })
          ]
        })
      });

      // ===== Renewal Checklist (NEW) =====
      const renewalChecklistItems = [
        { text: "Book QBR / renewal kickoff meeting", done: true },
        { text: "Validate stakeholder map & buying roles", done: false },
        { text: "Review billing/AR risks & dispute plan", done: false },
        { text: "Confirm load forecast + demand/TOU opportunities", done: false },
        { text: "Draft renewal proposal + pricing options", done: false },
        { text: "Exec sponsor alignment / escalation path", done: false }
      ];

      const renewalChecklist = new sap.m.VBox({
        items: renewalChecklistItems.map(i =>
          new sap.m.CheckBox({
            text: i.text,
            selected: i.done
          })
        )
      });

      const contractPopover = new sap.m.Popover({
        title: "Contract / Renewal Details",
        placement: "Auto",
        contentWidth: "460px",
        content: [
          new sap.m.VBox({
            width: "100%",
            items: [
              new sap.m.ObjectStatus({
                text: `Renewal in ${model.account.daysToRenewal} days`,
                state: (model.account.daysToRenewal <= 90) ? "Warning" : "Success",
                icon: "sap-icon://appointment-2"
              }),
              new sap.m.List({
                items: [
                  new sap.m.DisplayListItem({ label: "Renewal Date", value: model.account.renewalDate }),
                  new sap.m.DisplayListItem({ label: "Annual Revenue", value: `$${model.account.annualRevenue.toLocaleString()}` }),
                  new sap.m.DisplayListItem({ label: "Revenue-at-Risk (90d)", value: `$${model.account.revenueAtRisk.toLocaleString()}` })
                ]
              }),

              new sap.m.Title({ text: "Renewal Checklist", level: "H6" }),
              renewalChecklist,

              new sap.m.MessageStrip({
                text: "Tip: Aim to complete checklist items 60–90 days before renewal.",
                type: "Information",
                showIcon: true
              })
            ]
          })
        ],
        footer: new sap.m.Toolbar({
          content: [
            new sap.m.Button({ text: "Schedule QBR", type: "Emphasized", icon: "sap-icon://appointment-2" }),
            new sap.m.Button({ text: "Create Opportunity", icon: "sap-icon://lead" }),
            new sap.m.ToolbarSpacer(),
            new sap.m.Button({ text: "Close", press: () => contractPopover.close() })
          ]
        })
      });

      // =====================
      // 1) Recent / Planned Outages
      // =====================
      const outageContent = new sap.m.ObjectStatus({
        text: model.outage.text,
        state: model.outage.state,
        icon: "sap-icon://alert"
      });

      // =====================
      // 2) Risk card (with View button)
      // =====================
      const riskViewBtn = new sap.m.Button({
        text: "View",
        icon: "sap-icon://inspect",
        type: "Transparent",
        press: (oEvent) => riskPopover.openBy(oEvent.getSource())
      });

      const riskLevel = new sap.m.VBox({
        items: [
          new sap.m.HBox({
            justifyContent: "SpaceBetween",
            items: [
              new sap.m.ObjectStatus({
                text: model.account.riskLabel,
                state: model.account.riskState,
                icon: "sap-icon://shield"
              }),
              riskViewBtn
            ]
          }),
          new sap.m.Text({ text: "Top drivers:" }),
          new sap.m.FormattedText({ htmlText: buildChipsHtml(model.account.riskDrivers) }),
          new sap.m.Text({ text: "Last updated: " + model.account.lastUpdated, class: "muted" })
        ]
      });

      // =====================
      // 3) Revenue-at-Risk
      // =====================
      const revenueAtRiskContent = new sap.m.VBox({
        items: [
          new sap.m.ObjectNumber({
            number: model.account.revenueAtRisk.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 }),
            unit: "USD",
            state: "Warning"
          }),
          new sap.m.Label({ text: "Revenue-at-Risk (next 90 days)" }),
          new sap.m.Text({ text: model.account.revenueAtRiskTrend, class: "muted" }),
       // new sap.m.FormattedText({ htmlText: buildChipsHtml(model.account.riskDrivers) }),
          new sap.m.Toolbar({
            content: [
            //new sap.m.Button({ text: "Create Action", type: "Emphasized", icon: "sap-icon://add-task" }),
              new sap.m.ToolbarSpacer(),
              new sap.m.Button({ text: "View Drivers", icon: "sap-icon://cause" })
            ]
          })
        ]
      });

      // =====================
      // 4) Billing & AR Snapshot (with View button + tile aging)
      // =====================
      const arViewBtn = new sap.m.Button({
        text: "View",
        icon: "sap-icon://inspect",
        type: "Transparent",
        press: (oEvent) => arPopover.openBy(oEvent.getSource())
      });

      const arContent = new sap.m.VBox({
        items: [
          new sap.m.HBox({
            justifyContent: "SpaceBetween",
            items: [
              new sap.m.ObjectNumber({
                number: model.ar.totalPastDue.toFixed(2),
                unit: "USD Past Due",
                state: model.ar.totalPastDue > 0 ? "Error" : "Success"
              }),
              arViewBtn
            ]
          }),
          new sap.m.Text({ text: `DSO: ${model.ar.dso} days`, class: "muted" }),

          new sap.m.Title({ text: "Aging Buckets", level: "H6" }),
          new sap.m.FormattedText({ htmlText: agingHtml }),

          new sap.m.Title({ text: "Disputes", level: "H6" }),
          new sap.m.ObjectStatus({
            text: `${model.ar.disputes.count} open — $${model.ar.disputes.amount.toLocaleString()} (${model.ar.disputes.topReason})`,
            state: model.ar.disputes.count > 0 ? "Warning" : "Success",
            icon: "sap-icon://incident"
          }),

          new sap.m.Toolbar({
            content: [
              new sap.m.Button({ text: "Payment Plan", icon: "sap-icon://wallet" }),
              new sap.m.ToolbarSpacer(),
              new sap.m.Button({ text: "Open AR Items", icon: "sap-icon://money-bills" })
            ]
          })
        ]
      });

      // =====================
      // 5) Service / CX Operations
      // =====================
      const serviceOpsContent = new sap.m.VBox({
        items: [
          new sap.m.ObjectStatus({
            text: `Open Cases — High: ${model.service.openCases.high}, Med: ${model.service.openCases.med}, Low: ${model.service.openCases.low}`,
            state: (model.service.openCases.high > 0) ? "Error" : "None",
            icon: "sap-icon://customer"
          }),
          new sap.m.ObjectStatus({
            text: `SLA Breaches (30 days): ${model.service.slaBreaches30}`,
            state: (model.service.slaBreaches30 > 0) ? "Warning" : "Success",
            icon: "sap-icon://lateness"
          }),
          new sap.m.ObjectStatus({
            text: `Reopen Rate (90 days): ${model.service.reopenRate90}`,
            state: "None",
            icon: "sap-icon://redo"
          }),

          new sap.m.Title({ text: "Top Issue Categories", level: "H6" }),
          new sap.m.FormattedText({
            htmlText: `
              <ul style="margin:0.25rem 0 0 1.1rem;">
                ${model.service.topIssues.map(x => `<li>${x}</li>`).join("")}
              </ul>
              <div class="muted" style="margin-top:0.25rem;">Last touchpoint: ${model.service.lastTouchpoint}</div>
            `
          }),

       /*   new sap.m.Toolbar({
            content: [
              new sap.m.Button({ text: "Create Case", type: "Emphasized", icon: "sap-icon://add" }),
              new sap.m.ToolbarSpacer(),
              new sap.m.Button({ text: "Escalate", icon: "sap-icon://warning2" })
            ]
          }) */
        ]
      });

      // =====================
      // 6) Demand card
      // =====================
      const demandContent = new sap.m.VBox({
        items: [
          new sap.m.Label({ text: "Demand increased 12% YoY" }),
          new sap.m.ObjectStatus({ text: "Projected increase: +8% in 2026", state: "Success", icon: "sap-icon://trend-up" }),
          new sap.m.Text({ text: "Tip: Use peak + TOU split to position DR/TOU optimization.", class: "muted" })
        ]
      });

      // =====================
      // 7) Contract card (with View button)
      // =====================
      const contractViewBtn = new sap.m.Button({
        text: "View",
        icon: "sap-icon://inspect",
        type: "Transparent",
        press: (oEvent) => contractPopover.openBy(oEvent.getSource())
      });

      const contractContent = new sap.m.VBox({
        items: [
          new sap.m.HBox({
            justifyContent: "SpaceBetween",
            items: [
              new sap.m.ObjectStatus({
                text: `Exp. ${model.account.renewalDate} — Fixed Rate $0.14/kWh`,
                state: "None",
                icon: "sap-icon://calendar"
              }),
              contractViewBtn
            ]
          }),
          new sap.m.ObjectStatus({
            text: `Renewal in ${model.account.daysToRenewal} days`,
            state: (model.account.daysToRenewal <= 90) ? "Warning" : "Success",
            icon: "sap-icon://appointment-2"
          }),
          new sap.m.Label({ text: "Start Date: 03/15/2024" }),
          new sap.m.Label({ text: "Rate Plan ID: FXR14" }),
          new sap.m.Text({ text: "Rate Description: Fixed Commercial 12-month" }),
          new sap.m.Label({ text: "Total Revenue To Date: $29,413.76" })
        ]
      });

      // =====================
      // 8) Sentiment card
      // =====================
      const sentimentContent = new sap.m.VBox({
        items: [
          new sap.m.ObjectStatus({
            text: "Neutral sentiment (last 90 days)",
            state: "None",
            icon: "sap-icon://employee-rejections"
          }),
          new sap.m.Label({ text: "Last Touchpoint: Support Call (Email)" }),
          new sap.m.Label({ text: "Sentiment Trend: Improving" }),
          new sap.m.Text({ text: "Lowest Score (12 mo): Very Unhappy | Highest: Very Happy" })
        ]
      });

      // =====================
      // 9-11) Program cards
      // =====================
      const solarPrograms = new sap.m.VBox({
        items: [
          new sap.m.ObjectStatus({ text: "Rooftop Solar - Enrolled", state: "Success", icon: "sap-icon://energy-saving-lightbulb" }),
          new sap.m.ObjectStatus({ text: "Community Solar - Not Enrolled", state: "None", icon: "sap-icon://cancel" })
        ]
      });

      const evPrograms = new sap.m.VBox({
        items: [
          new sap.m.ObjectStatus({ text: "Hosted EV Charging - Enrolled", state: "Success", icon: "sap-icon://journey-arrival" }),
          new sap.m.ObjectStatus({ text: "Commercial EV Rate - Not Enrolled", state: "None", icon: "sap-icon://cancel" })
        ]
      });

      const efficiencyPrograms = new sap.m.VBox({
        items: [
          new sap.m.ObjectStatus({ text: "Battery Storage - Enrolled", state: "Success", icon: "sap-icon://add-equipment" }),
          new sap.m.ObjectStatus({ text: "TOU Rates - Enrolled", state: "Success", icon: "sap-icon://time-entry-request" }),
          new sap.m.ObjectStatus({ text: "Building Efficiency - Not Enrolled", state: "None", icon: "sap-icon://cancel" })
        ]
      });

      // =====================
      // Cards list
      // =====================
      const cards = [
        createCard("1. Recent / Planned Outages", outageContent),
        createCard("2. Customer Risk Level (Explainable)", riskLevel),
        createCard("3. Revenue-at-Risk (90 Days)", revenueAtRiskContent),

        createCard("4. Billing & AR Snapshot", arContent),
        createCard("5. Service / CX Operations", serviceOpsContent),
        createCard("6. Customer Demand YoY + Projection", demandContent),

        createCard("7. Contract Terms", contractContent),
        createCard("8. Account Sentiment", sentimentContent),
        createCard("9. Rate / Generation Programs", solarPrograms),

        createCard("10. Electric Vehicle Programs", evPrograms),
        createCard("11. Energy Storage / Efficiency", efficiencyPrograms)
      ];

      cards.forEach(card => card.placeAt("cardContainer"));

      // =====================
      // Demand chart (unchanged)
      // =====================
      const ctx = document.getElementById("demandChart").getContext("2d");
      new Chart(ctx, {
        type: "line",
        data: {
          labels: ["2020", "2021", "2022", "2023", "2024", "2025", "2026*"],
          datasets: [
            {
              label: "Peak Demand (kW)",
              data: [420, 460, 510, 540, 580, 620, 670],
              borderColor: "#0a6ed1",
              backgroundColor: "rgba(10,110,209,0.1)",
              fill: true,
              tension: 0.3,
              pointBackgroundColor: "#0a6ed1"
            },
            {
